# FPL production nginx: generic SPA baseline + same-origin /fpl-api proxy.
# Browser clients use /fpl-api/... because fantasy.premierleague.com blocks CORS.
# Vite's /fpl-api proxy remains development/preview only.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Strip /fpl-api prefix → official FPL JSON API (mirrors Vite rewrite).
    location /fpl-api/ {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host fantasy.premierleague.com;
        proxy_set_header Accept application/json;
        proxy_set_header User-Agent "FPL-PWA/0.0 (production container; https://github.com/RSHomeServer/FPL-PWA)";
        proxy_pass https://fantasy.premierleague.com/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /packs/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
